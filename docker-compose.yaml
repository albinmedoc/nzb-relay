services:
  nzb-relay:
    image: ghcr.io/albinmedoc/nzb-relay:latest
    container_name: nzb-relay
    # Official command-line RAR for Linux is x64, so this image is amd64-only.
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    environment:
      API_KEY: "change-me"
      CORS_ORIGINS: "http://localhost:8080"
      WEBHOOK_URL: "https://n8n.example.com/webhook/nzb-relay"
      WEBHOOK_SECRET: "change-me"
      WATCHLIST_AUTO_NZB: "true"
      WATCHLIST_POLL_INTERVAL_SECONDS: "3600"
      WATCHLIST_MAX_ATTEMPTS: "3"
      USENET_HOST: "news.example.com"
      USENET_USER: "usenet-user"
      USENET_PASS: "usenet-password"
      USENET_NEWSGROUPS: "alt.binaries.example,alt.binaries.misc"
      USENET_NEWSGROUPS_PER_UPLOAD: "20"
      # SABNZBD_URL: "http://sabnzbd:8080/api"
      # SABNZBD_API_KEY: "sab-api-key"
      # SABNZBD_MOVIE_CATEGORY: "movies"
      # SABNZBD_SERIES_CATEGORY: "series"
      # SABNZBD_CATEGORY: "*"

  nzb-relay-frontend:
    image: ghcr.io/albinmedoc/nzb-relay-frontend:latest
    container_name: nzb-relay-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - nzb-relay
