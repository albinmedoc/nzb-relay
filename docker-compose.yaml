services:
  nzb-relay:
    image: ghcr.io/albinmedoc/nzb-relay:latest
    container_name: nzb-relay
    # Official command-line RAR for Linux is x64, so this image is amd64-only.
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    environment:
      API_KEY: "change-me"
      WEBHOOK_URL: "https://n8n.example.com/webhook/nzb-relay"
      WEBHOOK_SECRET: "change-me"
      USENET_HOST: "news.example.com"
      USENET_USER: "usenet-user"
      USENET_PASS: "usenet-password"
      USENET_NEWSGROUPS: "alt.binaries.example,alt.binaries.misc"
